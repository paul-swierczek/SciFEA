<svg xmlns="http://w3.org" viewBox="0 0 920 520" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" rx="12" fill="#f8fafc" />

  <!-- Title & Key -->
  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">SciFEA Module Dependency Hierarchy</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">Arrow direction indicates import flow (Higher files import lower files)</text>

  <!-- ==================== CONNECTION LINES ==================== -->
  <g fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)">
    <!-- From SciFEA_main.py (Bottom center: 460, 140) -->
    <!-- To Mid-Tier -->
    <path d="M 420 140 L 210 230" />
    <path d="M 460 140 L 460 230" />
    <path d="M 500 140 L 710 230" />
    
    <!-- To Bottom-Tier (routed around mid-tier boxes) -->
    <path d="M 380 125 C 120 145, 70 250, 210 385" />
    <path d="M 440 140 C 335 200, 335 320, 440 385" />
    <path d="M 540 125 C 830 145, 860 250, 720 385" />

    <!-- From symbolic_solver.py (Bottom center: 210, 285) -->
    <path d="M 195 285 L 225 385" />
    <path d="M 230 285 L 425 385" />

    <!-- From numerical_solver.py (Bottom center: 460, 285) -->
    <path d="M 440 285 L 260 385" />
    <path d="M 460 285 L 460 385" />

    <!-- From post_processor_functions.py (Bottom center: 710, 285) -->
    <path d="M 680 285 L 285 385" />
    <path d="M 700 285 L 495 385" />
  </g>

  <!-- ==================== TIER 1: ENTRY POINT ==================== -->
  <g filter="url(#shadow)">
    <rect x="370" y="90" width="180" height="50" rx="8" fill="#1e293b" />
    <text x="460" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">SciFEA_main.py</text>
  </g>

  <!-- ==================== TIER 2: SOLVERS & POST-PROCESSOR ==================== -->
  <g filter="url(#shadow)">
    <!-- symbolic_solver.py -->
    <rect x="115" y="235" width="190" height="50" rx="8" fill="#0284c7" />
    <text x="210" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">symbolic_solver.py</text>

    <!-- numerical_solver.py -->
    <rect x="365" y="235" width="190" height="50" rx="8" fill="#0284c7" />
    <text x="460" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">numerical_solver.py</text>

    <!-- post_processor_functions.py -->
    <rect x="595" y="235" width="230" height="50" rx="8" fill="#0284c7" />
    <text x="710" y="265" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">post_processor_functions.py</text>
  </g>

  <!-- ==================== TIER 3: CORE LIBRARIES & HELPERS ==================== -->
  <g filter="url(#shadow)">
    <!-- elements.py -->
    <rect x="150" y="390" width="170" height="50" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <text x="235" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">elements.py</text>

    <!-- function_builder.py -->
    <rect x="370" y="390" width="180" height="50" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <text x="460" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">function_builder.py</text>

    <!-- dialog_helpers.py -->
    <rect x="615" y="390" width="170" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text x="700" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">dialog_helpers.py</text>
  </g>

  <!-- Footer Note -->
  <text x="460" y="490" text-anchor="middle" font-size="12" fill="#64748b">Acyclic Directed Graph (DAG) — Zero circular dependencies</text>
</svg>
