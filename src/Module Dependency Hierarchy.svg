<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b" />
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #18181b; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #52525b; text-anchor: middle; }
      .level-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #52525b; text-anchor: end; }
      .box { fill: #18181b; rx: 2px; }
      .box-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .connector { fill: none; stroke: #18181b; stroke-width: 1.6; stroke-linejoin: miter; marker-end: url(#arrow); }
    </style>
  </defs>

  
  <rect width="1100" height="600" fill="#ffffff" rx="6" />

  
  <text x="560" y="42" class="title">SciFEA — Module Dependency Diagram</text>
  <text x="560" y="65" class="subtitle">Imports flow downward (higher modules import lower modules)</text>

  
  <text x="140" y="166" class="level-label">TOP LEVEL</text>
  <text x="140" y="182" class="level-label">(Main)</text>

  <text x="140" y="326" class="level-label">MIDDLE LEVEL</text>
  <text x="140" y="342" class="level-label">(Solvers &amp; Helpers)</text>

  <text x="140" y="491" class="level-label">BOTTOM LEVEL</text>
  <text x="140" y="507" class="level-label">(Foundation)</text>

  
  
  <path d="M 460 173 H 260 V 302" class="connector" />
  
  <path d="M 530 201 V 232 H 367 V 467" class="connector" />
  
  <path d="M 555 201 V 252 H 480 V 302" class="connector" />
  
  <path d="M 592 201 V 467" class="connector" />
  
  <path d="M 630 201 V 252 H 730 V 302" class="connector" />
  
  <path d="M 660 173 H 972 V 302" class="connector" />

  
  
  <path d="M 260 361 V 418 H 335 V 467" class="connector" />
  
  <path d="M 305 361 V 400 H 535 V 467" class="connector" />

  
  <path d="M 415 361 V 467" class="connector" />
  
  <path d="M 560 361 V 467" class="connector" />

  
  <path d="M 675 361 V 384 H 450 V 467" class="connector" />
  
  <path d="M 735 361 V 418 H 645 V 467" class="connector" />

  
  <g>
    <rect x="460" y="145" width="200" height="56" class="box" />
    <text x="560" y="173" class="box-text">SciFEA_main.py</text>
  </g>

  
  <g>
    <rect x="170" y="305" width="180" height="56" class="box" />
    <text x="260" y="333" class="box-text">symbolic_solver.py</text>
  </g>
  <g>
    <rect x="385" y="305" width="190" height="56" class="box" />
    <text x="480" y="333" class="box-text">numerical_solver.py</text>
  </g>
  <g>
    <rect x="610" y="305" width="240" height="56" class="box" />
    <text x="730" y="333" class="box-text">post_processor_functions.py</text>
  </g>
  <g>
    <rect x="885" y="305" width="175" height="56" class="box" />
    <text x="972.5" y="333" class="box-text">dialog_helpers.py</text>
  </g>

  
  <g>
    <rect x="300" y="470" width="180" height="56" class="box" />
    <text x="390" y="498" class="box-text">elements.py</text>
  </g>
  <g>
    <rect x="510" y="470" width="195" height="56" class="box" />
    <text x="607.5" y="498" class="box-text">function_builder.py</text>
